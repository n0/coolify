  kafka-init:
    restart: 'no'
    image: docker.io/redpandadata/redpanda:v25.1.9
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        echo "Waiting for Kafka broker to accept connections..."
        TIMEOUT=60
        ELAPSED=0
        until rpk topic list --brokers kafka:9092 2>/dev/null; do
            echo "Kafka broker not ready yet (elapsed: $${ELAPSED}s)..."
            sleep 2
            ELAPSED=$$((ELAPSED + 2))
            if [ $$ELAPSED -ge $$TIMEOUT ]; then
                echo "Timeout waiting for Kafka broker after $${TIMEOUT}s"
                echo "Final attempt to list topics:"
                rpk topic list --brokers kafka:9092 || true
                exit 1
            fi
        done
        echo "Kafka broker is accepting requests, creating topics..."
        TOPICS=$$(grep -vE '^[[:space:]]*#|^[[:space:]]*$$' /topics.txt)
        for topic in $$TOPICS; do
            if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                echo "Topic $$topic created successfully"
            else
                if rpk topic list --brokers kafka:9092 | awk '{print $$1}' | grep -qx "$$topic"; then
                    echo "Topic $$topic already exists, continuing"
                else
                    echo "Failed to create topic $$topic"
                    exit 1
                fi
            fi
        done
        echo "Final topic list:"
        rpk topic list --brokers kafka:9092
        echo "Topics ready"
    volumes:
      - type: bind
        source: ./kafka/topics.txt
        target: /topics.txt
        read_only: true
        content: |
          clickhouse_ai_events_json
          clickhouse_app_metrics
          clickhouse_app_metrics2
          clickhouse_billing_usage_records
          clickhouse_document_embeddings
          clickhouse_error_tracking_fingerprint_issue_state
          clickhouse_error_tracking_issue_fingerprint
          clickhouse_events_json
          clickhouse_flag_evaluations
          clickhouse_groups
          clickhouse_heatmap_events
          clickhouse_hog_invocation_results
          clickhouse_ingestion_events_duplicates
          clickhouse_ingestion_warnings
          clickhouse_logs
          clickhouse_message_assets
          clickhouse_metrics
          clickhouse_performance_events
          clickhouse_person
          clickhouse_person_distinct_id
          clickhouse_person_override
          clickhouse_person_unique_id
          clickhouse_precalculated_person_properties
          clickhouse_prefiltered_events
          clickhouse_property_values
          clickhouse_session_replay_events
          clickhouse_session_replay_features
          clickhouse_tophog
          clickhouse_traces
          cohort_membership_changed
          distinct_id_usage_events_json
          document_embedding_results
          document_embeddings_input
          error_tracking_ingestion_notifications
          events_dead_letter_queue
