# documentation: https://posthog.com/docs/self-host
# slogan: Product analytics, session replay, and feature flags
# category: analytics
# tags: analytics, product, self-hosted, ab-testing, event-tracking
# logo: svgs/posthog.svg
# minversion: 4.4.7
# preserve_service_url: true

x-coolify-path-routing: true
services:
  permissions-init:
    restart: 'no'
    image: alpine:3.24
    command:
      - sh
      - -c
      - chmod -R a+rX /configs
    volumes:
      - type: bind
        source: ./clickhouse
        target: /configs/clickhouse
        is_directory: true
      - type: bind
        source: ./idl
        target: /configs/idl
        is_directory: true
      - type: bind
        source: ./livestream
        target: /configs/livestream
        is_directory: true
      - type: bind
        source: ./temporal
        target: /configs/temporal
        is_directory: true
      - type: bind
        source: ./kafka
        target: /configs/kafka
        is_directory: true
  assets-init:
    restart: 'no'
    image: posthog/posthog@sha256:e0a07e9afc000ac31d710d0243a1035caf46ab16ede1959f6e2fd5b3fe7e6554
    user: root
    entrypoint:
      - sh
      - -c
    command:
      - cp -a /code/posthog/user_scripts/. /user_scripts/ && cp /code/share/GeoLite2-City.mmdb /share/GeoLite2-City.mmdb && chmod -R a+rX /user_scripts
        /share
    volumes:
      - posthog-user-scripts:/user_scripts
      - posthog-share:/share
  db:
    image: postgres:15.12-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U posthog
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    volumes:
      - posthog-postgres-data:/var/lib/postgresql/data
  redis7:
    image: redis:7.2-alpine
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - redis7-data:/data
  valkey:
    image: valkey/valkey:8.1-alpine
    command: valkey-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 3s
      timeout: 10s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.13.15
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      KAFKA_HOSTS: kafka:9092
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      kafka:
        condition: service_started
      zookeeper:
        condition: service_started
      permissions-init:
        condition: service_completed_successfully
      assets-init:
        condition: service_completed_successfully
    volumes:
      - posthog-clickhouse-data:/var/lib/clickhouse
      - posthog-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - type: bind
        source: ./clickhouse/config.xml
        target: /etc/clickhouse-server/config.xml
        read_only: true
        content: |
          <?xml version="1.0"?>

          <clickhouse>
              <logger>
                  <level>warning</level>
                  <log>/var/log/clickhouse-server/clickhouse-server.log</log>
                  <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>

                  <size>100M</size>
                  <count>3</count>
              </logger>

              <http_port>8123</http_port>
              <mysql_port>9004</mysql_port>
              <postgresql_port>9005</postgresql_port>
              <https_port>8443</https_port>
              <tcp_port_secure>9440</tcp_port_secure>
              <interserver_http_port>9009</interserver_http_port>
              <max_connections>4096</max_connections>
              <keep_alive_timeout>3</keep_alive_timeout>

              <openSSL>
                  <server>
                      <certificateFile>/etc/clickhouse-server/server.crt</certificateFile>
                      <privateKeyFile>/etc/clickhouse-server/server.key</privateKeyFile>
                      <dhParamsFile>/etc/clickhouse-server/dhparam.pem</dhParamsFile>
                      <verificationMode>none</verificationMode>
                      <loadDefaultCAFile>true</loadDefaultCAFile>
                      <cacheSessions>true</cacheSessions>
                      <disableProtocols>sslv2,sslv3</disableProtocols>
                      <preferServerCiphers>true</preferServerCiphers>
                  </server>

                  <client>
                      <loadDefaultCAFile>true</loadDefaultCAFile>
                      <cacheSessions>true</cacheSessions>
                      <disableProtocols>sslv2,sslv3</disableProtocols>
                      <preferServerCiphers>true</preferServerCiphers>
                      <invalidCertificateHandler>
                          <name>RejectCertificateHandler</name>
                      </invalidCertificateHandler>
                  </client>
              </openSSL>


              <max_concurrent_queries>200</max_concurrent_queries>


              <max_server_memory_usage>0</max_server_memory_usage>




              <background_message_broker_schedule_pool_size>128</background_message_broker_schedule_pool_size>
              <max_thread_pool_size>10000</max_thread_pool_size>


              <background_pool_size>4</background_pool_size>


              <background_merges_mutations_concurrency_ratio>8</background_merges_mutations_concurrency_ratio>





              <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>


              <total_memory_profiler_step>4194304</total_memory_profiler_step>


              <total_memory_tracker_sample_probability>0</total_memory_tracker_sample_probability>





              <uncompressed_cache_size>8589934592</uncompressed_cache_size>


              <mark_cache_size>5368709120</mark_cache_size>

              <mmap_cache_size>1000</mmap_cache_size>


              <compiled_expression_cache_size>134217728</compiled_expression_cache_size>


              <compiled_expression_cache_elements_size>10000</compiled_expression_cache_elements_size>


              <path>/var/lib/clickhouse/</path>


              <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>


              <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>

              <user_directories>
                  <users_xml>

                      <path>users.xml</path>
                  </users_xml>
                  <local_directory>

                      <path>/var/lib/clickhouse/access/</path>
                  </local_directory>

              </user_directories>

              <default_profile>default</default_profile>

              <custom_settings_prefixes></custom_settings_prefixes>

              <default_database>default</default_database>

              <mlock_executable>true</mlock_executable>


              <remap_executable>false</remap_executable>

              <remote_url_allow_hosts>
                  <host_regexp>.*</host_regexp>
              </remote_url_allow_hosts>

              <zookeeper>
                  <node>
                      <host>zookeeper</host>
                      <port>2181</port>
                  </node>
              </zookeeper>


              <builtin_dictionaries_reload_interval>3600</builtin_dictionaries_reload_interval>


              <max_session_timeout>3600</max_session_timeout>


              <default_session_timeout>60</default_session_timeout>


              <query_log>

                  <database>system</database>
                  <table>query_log</table>
                  <partition_by>toYYYYMM(event_date)</partition_by>


                  <flush_interval_milliseconds>500</flush_interval_milliseconds>

                  <max_size_rows>8388608</max_size_rows>

                  <reserved_size_rows>8192</reserved_size_rows>

                  <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>

                  <flush_on_crash>true</flush_on_crash>




                  <ttl>event_date + INTERVAL 12 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </query_log>


              <query_thread_log>
                  <database>system</database>
                  <table>query_thread_log</table>
                  <partition_by>toYYYYMM(event_date)</partition_by>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                  <max_size_rows>8388608</max_size_rows>
                  <reserved_size_rows>8192</reserved_size_rows>
                  <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
                  <flush_on_crash>false</flush_on_crash>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </query_thread_log>


              <query_views_log>
                  <database>system</database>
                  <table>query_views_log</table>
                  <partition_by>toYYYYMM(event_date)</partition_by>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </query_views_log>


              <text_log>
                  <database>system</database>
                  <table>text_log</table>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                  <level>trace</level>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </text_log>


              <metric_log>
                  <database>system</database>
                  <table>metric_log</table>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                  <collect_interval_milliseconds>1000</collect_interval_milliseconds>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </metric_log>


              <asynchronous_metric_log>
                  <database>system</database>
                  <table>asynchronous_metric_log</table>

                  <flush_interval_milliseconds>7000</flush_interval_milliseconds>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </asynchronous_metric_log>


              <opentelemetry_span_log>

                  <engine>
                      engine MergeTree
                      partition by toYYYYMM(finish_date)
                      order by (finish_date, finish_time_us, trace_id)
                  </engine>
                  <database>system</database>
                  <table>opentelemetry_span_log</table>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>
              </opentelemetry_span_log>



              <crash_log>
                  <database>system</database>
                  <table>crash_log</table>

                  <partition_by />
                  <flush_interval_milliseconds>1000</flush_interval_milliseconds>
                  <max_size_rows>1024</max_size_rows>
                  <reserved_size_rows>1024</reserved_size_rows>
                  <buffer_size_rows_flush_threshold>512</buffer_size_rows_flush_threshold>
                  <flush_on_crash>true</flush_on_crash>
              </crash_log>


              <session_log>
                  <database>system</database>
                  <table>session_log</table>

                  <partition_by>toYYYYMM(event_date)</partition_by>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </session_log>

              <backup_log>
                  <database>system</database>
                  <table>backup_log</table>
                  <partition_by>toYYYYMM(event_date)</partition_by>
                  <flush_interval_milliseconds>7500</flush_interval_milliseconds>

                  <ttl>event_date + INTERVAL 5 DAY</ttl>
                  <ttl_only_drop_parts>1</ttl_only_drop_parts>
              </backup_log>


              <top_level_domains_lists>

              </top_level_domains_lists>


              <dictionaries_config>*_dictionary.xml</dictionaries_config>


              <user_defined_executable_functions_config>*_function.xml</user_defined_executable_functions_config>

              <distributed_ddl>

                  <path>/clickhouse/task_queue/ddl</path>
              </distributed_ddl>


              <graphite_rollup_example>
                  <pattern>
                      <regexp>click_cost</regexp>
                      <function>any</function>
                      <retention>
                          <age>0</age>
                          <precision>3600</precision>
                      </retention>
                      <retention>
                          <age>86400</age>
                          <precision>60</precision>
                      </retention>
                  </pattern>
                  <default>
                      <function>max</function>
                      <retention>
                          <age>0</age>
                          <precision>60</precision>
                      </retention>
                      <retention>
                          <age>3600</age>
                          <precision>300</precision>
                      </retention>
                      <retention>
                          <age>86400</age>
                          <precision>3600</precision>
                      </retention>
                  </default>
              </graphite_rollup_example>


              <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>


              <query_masking_rules>
                  <rule>
                      <name>hide encrypt/decrypt arguments</name>
                      <regexp>((?:aes_)?(?:encrypt|decrypt)(?:_mysql)?)\s*\(\s*(?:'(?:\\'|.)+'|.*?)\s*\)</regexp>

                      <replace>\1(???)</replace>
                  </rule>
              </query_masking_rules>

              <merge_tree>
                  <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool>
                  <number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>
                  <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>2</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
              </merge_tree>
          </clickhouse>
      - type: bind
        source: ./clickhouse/config.d/default.xml
        target: /etc/clickhouse-server/config.d/default.xml
        read_only: true
        content: |
          <clickhouse>
              <tcp_port>9000</tcp_port>

              <remote_servers>
                  <posthog>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </posthog>
                  <posthog_single_shard>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </posthog_single_shard>
                  <posthog_migrations>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </posthog_migrations>
                  <posthog_writable>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </posthog_writable>
                  <posthog_primary_replica>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </posthog_primary_replica>

                  <ai_events>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </ai_events>
                  <aux>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </aux>
                  <ops>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </ops>
                  <sessions>
                      <shard>
                          <replica>
                              <host>clickhouse</host>
                              <port>9000</port>
                          </replica>
                      </shard>
                  </sessions>
              </remote_servers>

              <named_collections>
                  <msk_cluster>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </msk_cluster>
                  <warpstream_ingestion>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_ingestion>
                  <warpstream_calculated_events>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_calculated_events>
                  <warpstream_replay>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_replay>
                  <warpstream_shared>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_shared>
                  <warpstream_cyclotron>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_cyclotron>
                  <warpstream_logs>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_logs>
                  <warpstream_traces>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_traces>
                  <warpstream_metrics>
                      <kafka_broker_list from_env="KAFKA_HOSTS"/>
                  </warpstream_metrics>
              </named_collections>

              <macros>
                  <shard>01</shard>
                  <replica>ch1</replica>
                  <hostClusterType>online</hostClusterType>
                  <hostClusterRole>data</hostClusterRole>
              </macros>
          </clickhouse>
      - type: bind
        source: ./clickhouse/users.xml
        target: /etc/clickhouse-server/users.xml
        read_only: true
        content: |
          <?xml version="1.0"?>
          <yandex>



              <profiles>

                  <default>

                      <max_memory_usage>10000000000</max_memory_usage>



                      <load_balancing>random</load_balancing>

                      <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>

                      <compatibility>26.6</compatibility>

                      <optimize_rewrite_has_to_in>0</optimize_rewrite_has_to_in>

                      <enable_materialized_cte>1</enable_materialized_cte>

                      <async_insert>0</async_insert>

                      <optimize_empty_string_comparisons>0</optimize_empty_string_comparisons>
