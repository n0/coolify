                  </argument>
                  <format>RowBinaryWithNamesAndTypes</format>
                  <send_chunk_header>true</send_chunk_header>
                  <stderr_reaction>throw</stderr_reaction>
                  <command>aggregate_funnel steps --variant=cohort</command>
                  <lifetime>600</lifetime>
              </function>

              <function>
                  <type>executable_pool</type>
                  <name>aggregate_funnel_array</name>
                  <return_type>Array(Tuple(Int8, Array(String), Array(Float64), Array(Array(UUID)), UInt32))</return_type>
                  <return_name>result</return_name>
                  <argument>
                      <type>UInt8</type>
                      <name>num_steps</name>
                  </argument>
