              </users>


              <quotas>

                  <default>

                      <interval>

                          <duration>3600</duration>


                          <queries>0</queries>
                          <errors>0</errors>
                          <result_rows>0</result_rows>
                          <read_rows>0</read_rows>
                          <execution_time>0</execution_time>
                      </interval>
                  </default>
              </quotas>
          </yandex>
      - type: bind
        source: ./clickhouse/user_defined_function.xml
        target: /etc/clickhouse-server/user_defined_function.xml
        read_only: true
        content: |
          <functions>
              <function>
                  <type>executable_pool</type>
                  <name>aggregate_funnel</name>
                  <return_type>Array(Tuple(Int8, Nullable(String), Array(Float64), Array(Array(UUID)), UInt32))</return_type>
                  <return_name>result</return_name>
                  <argument>
                      <type>UInt8</type>
                      <name>num_steps</name>
                  </argument>
                  <argument>
                      <type>UInt64</type>
                      <name>conversion_window_limit</name>
                  </argument>
                  <argument>
                      <type>String</type>
                      <name>breakdown_attribution_type</name>
                  </argument>
                  <argument>
                      <type>String</type>
                      <name>funnel_order_type</name>
                  </argument>
                  <argument>
                      <type>Array(Nullable(String))</type>
                      <name>prop_vals</name>
                  </argument>
                  <argument>
                      <type>Array(Int8)</type>
                      <name>optional_steps</name>
                  </argument>
                  <argument>
                      <type>Array(Tuple(Nullable(Float64), UUID, Nullable(String), Array(Int8)))</type>
                      <name>value</name>
                  </argument>
                  <format>RowBinaryWithNamesAndTypes</format>
                  <send_chunk_header>true</send_chunk_header>
                  <stderr_reaction>throw</stderr_reaction>
                  <command>aggregate_funnel steps --variant=plain</command>
                  <lifetime>600</lifetime>
              </function>

              <function>
                  <type>executable_pool</type>
                  <name>aggregate_funnel_cohort</name>
                  <return_type>Array(Tuple(Int8, UInt64, Array(Float64), Array(Array(UUID)), UInt32))</return_type>
                  <return_name>result</return_name>
                  <argument>
                      <type>UInt8</type>
                      <name>num_steps</name>
                  </argument>
                  <argument>
                      <type>UInt64</type>
                      <name>conversion_window_limit</name>
                  </argument>
                  <argument>
                      <type>String</type>
                      <name>breakdown_attribution_type</name>
                  </argument>
                  <argument>
                      <type>String</type>
                      <name>funnel_order_type</name>
                  </argument>
                  <argument>
                      <type>Array(UInt64)</type>
                      <name>prop_vals</name>
                  </argument>
                  <argument>
                      <type>Array(Int8)</type>
                      <name>optional_steps</name>
                  </argument>
                  <argument>
                      <type>Array(Tuple(Nullable(Float64), UUID, UInt64, Array(Int8)))</type>
