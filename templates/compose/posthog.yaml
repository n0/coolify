                if echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:19001 2>/dev/null | grep -q ai-blobs \
                        && echo 's3.configure' | /usr/bin/weed shell -master=localhost:19001 2>/dev/null | grep -q ${SERVICE_USER_STORAGE}; then
                    touch /tmp/objectstorage-ready
                    echo "Objectstorage SeaweedFS ready with required buckets and identities"
                    break
                fi
                sleep 1
            done
        ) &
        exec /usr/bin/weed "$$@"
      - --
